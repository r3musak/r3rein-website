<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101317">
  <meta name="description" content="R3REIN – Fahrzeugaufbereitung und Innenraumreinigung. Wir starten bald.">
  <title>R3REIN</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {color-scheme:dark; --bg:#101317;--gold:#c9a66b;--white:#f6f5f2;--muted:#a9b1ba}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif}
    body{background:radial-gradient(ellipse at 50% 40%,#23252a 0%,#15181c 44%,var(--bg) 100%);color:var(--white);min-height:100vh;display:flex;flex-direction:column}
    main{width:min(90%,780px);margin:auto;text-align:center;padding:70px 0}
    .eyebrow{color:var(--gold);font-size:.73rem;letter-spacing:.24em;font-weight:700;text-transform:uppercase;line-height:1.8}
    .logo{display:inline-block;font-size:clamp(3.6rem,12vw,8rem);letter-spacing:.055em;font-weight:850;line-height:1.2;margin:25px 0 0;cursor:default;transition:letter-spacing .45s ease,filter .45s ease,transform .45s ease;transform-origin:center;white-space:nowrap}
    .logo:hover{letter-spacing:.095em;filter:drop-shadow(0 0 16px rgba(201,166,107,.3));transform:translateY(-3px)}
    .logo sup{font-size:.46em;vertical-align:super;color:var(--gold);letter-spacing:0;margin-right:.12em;display:inline-block;transition:transform .45s ease,color .45s ease}
    .logo:hover sup{transform:translateY(-5px);color:#e9c68c}
    .tagline{font-size:clamp(.95rem,2.5vw,1.2rem);letter-spacing:.06em;color:#e0e2e4;margin:8px 0 60px}
    .rule{width:64px;height:2px;background:var(--gold);margin:0 auto 34px}
    h1{font-size:clamp(1.5rem,5vw,2.7rem);letter-spacing:.12em;margin:0 0 20px;font-weight:800}
    .desc{color:var(--muted);line-height:1.8;font-size:1rem;max-width:520px;margin:0 auto 38px}
    .social{display:inline-flex;align-items:center;gap:10px;border:1px solid #55504a;border-radius:100px;color:var(--white);padding:12px 21px;text-decoration:none;font-size:.92rem;transition:border-color .2s,background .2s}
    .social:hover,.social:focus-visible{border-color:var(--gold);background:#ffffff0b}
    .social svg{width:18px;height:18px;stroke:var(--gold)}
    footer{text-align:center;padding:22px 20px 30px;color:#8e98a3;font-size:.78rem;letter-spacing:.04em}
    footer a{color:#c7cdd3;text-decoration:none}
    @media(max-width:480px){.tagline{margin-bottom:46px}.logo{margin-top:20px;font-size:clamp(3rem,12vw,4.6rem);letter-spacing:.025em}.logo:hover{letter-spacing:.05em}}
    @media(prefers-reduced-motion:reduce){.logo,.logo sup{transition:none}.logo:hover{transform:none}.logo:hover sup{transform:none}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Fahrzeugaufbereitung · Neumünster</div>
    <div class="logo" aria-label="R hoch drei Rein">R<sup>3</sup>REIN</div>
    <p class="tagline">Rein. Reiner. R3REIN.</p>
    <div class="rule"></div>
    <h1>WIR STARTEN BALD.</h1>
    <p class="desc">Professionelle Fahrzeugaufbereitung und Innenraumreinigung.<br>Etwas Neues entsteht.</p>
    <a class="social" href="https://www.instagram.com/r3rein.de/" target="_blank" rel="noopener noreferrer" aria-label="R3REIN auf Instagram besuchen">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/></svg>
      @r3rein.de
    </a>
  </main>
  <footer>© R3REIN · <a href="https://r3rein.de">r3rein.de</a></footer>
</body>
</html>
